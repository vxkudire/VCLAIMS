server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: git
#   active: native          # used for local testing
  cloud:
    config:
      server:
        git:
          uri: https://github.com/vxkudire/VCLAIMS-CONFIG.git
          username: ${GIT_USERNAME}
          password: ${GIT_TOKEN}
          default-label: master
          force-pull: true
          timeout: 5
#       native:
#         search-locations: "file:G:///My Drive//Learn//vxkudire//config"     # used for local testing
#         search-locations: "classpath:/config"                               # used for local testing

encrypt:
  key: ${CONFIG_ENCRYPT_KEY}    # Some random key

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"