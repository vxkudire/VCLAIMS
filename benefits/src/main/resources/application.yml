spring:
  application:
    name: benefits
  profiles:
    active: prod
  sql:
    init:
      mode: always   # to execute data.sql

  jpa:
    defer-datasource-initialization: true   # Run data.sql after Hibernate creates/updates tables
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  config:
    import: optional:configserver:http://localhost:8888/

eureka:
  instance:
    preferIpAddress: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/


